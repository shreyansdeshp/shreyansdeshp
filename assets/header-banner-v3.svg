<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#001410"/>
      <stop offset="55%" stop-color="#00352F"/>
      <stop offset="100%" stop-color="#CEDC00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="#06110D"/>
  <polygon points="0,220 1200,220 1200,0" fill="url(#bg)"/>

  <!-- A380 top-view silhouette -->
  <g transform="translate(600,112)" opacity="0.28" fill="#06110D">
    <!-- fuselage -->
    <path d="M-16,-98 C-6,-100 6,-100 16,-98 L19,70 C19,92 10,100 0,102 C-10,100 -19,92 -19,70 Z"/>
    <!-- nose cone -->
    <path d="M-16,-98 C-8,-108 8,-108 16,-98 L14,-80 L-14,-80 Z"/>
    <!-- main wings, swept -->
    <path d="M-19,10 L-330,98 C-345,103 -345,112 -330,110 L-20,48 Z"/>
    <path d="M19,10 L330,98 C345,103 345,112 330,110 L20,48 Z"/>
    <!-- winglets -->
    <path d="M-330,98 L-345,82 L-336,108 Z"/>
    <path d="M330,98 L345,82 L336,108 Z"/>
    <!-- horizontal stabilizers -->
    <path d="M-10,78 L-110,112 C-118,115 -118,121 -110,120 L-11,94 Z"/>
    <path d="M10,78 L110,112 C118,115 118,121 110,120 L11,94 Z"/>
    <!-- tail fin -->
    <path d="M-5,70 L-2,8 C-2,2 2,2 2,8 L5,70 Z"/>
    <!-- engines -->
    <ellipse cx="-110" cy="56" rx="7" ry="22"/>
    <ellipse cx="-210" cy="78" rx="7" ry="22"/>
    <ellipse cx="110" cy="56" rx="7" ry="22"/>
    <ellipse cx="210" cy="78" rx="7" ry="22"/>
  </g>

  <text x="600" y="128" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800"
        fill="#CEDC00" text-anchor="middle">Shreyans Deshpande</text>
</svg>
