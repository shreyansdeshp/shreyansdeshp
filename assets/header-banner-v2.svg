<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#001410"/>
      <stop offset="55%" stop-color="#00352F"/>
      <stop offset="100%" stop-color="#0B4A3F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <g transform="translate(600,130)" fill="none" stroke="#CEDC00" stroke-width="2" opacity="0.55">
    <!-- fuselage outline: nose left, tail right -->
    <path d="M-430,0 L-370,-10 L-370,10 Z"/>
    <path d="M-370,-10 C-200,-16 200,-16 350,-9 C395,-7 420,-3 430,0 C420,3 395,7 350,9 C200,16 -200,16 -370,10 Z"/>

    <!-- cockpit windows -->
    <rect x="-355" y="-3" width="10" height="6" rx="1"/>

    <!-- cabin window strip -->
    <g stroke-width="1.3">
      <rect x="-330" y="-6" width="6" height="4"/>
      <rect x="-312" y="-6" width="6" height="4"/>
      <rect x="-294" y="-6" width="6" height="4"/>
      <rect x="-276" y="-6" width="6" height="4"/>
      <rect x="-258" y="-6" width="6" height="4"/>
      <rect x="-240" y="-6" width="6" height="4"/>
      <rect x="-222" y="-6" width="6" height="4"/>
      <rect x="-204" y="-6" width="6" height="4"/>
      <rect x="-186" y="-6" width="6" height="4"/>
      <rect x="-20" y="-6" width="6" height="4"/>
      <rect x="2" y="-6" width="6" height="4"/>
      <rect x="24" y="-6" width="6" height="4"/>
      <rect x="46" y="-6" width="6" height="4"/>
      <rect x="68" y="-6" width="6" height="4"/>
      <rect x="90" y="-6" width="6" height="4"/>
      <rect x="112" y="-6" width="6" height="4"/>
      <rect x="134" y="-6" width="6" height="4"/>
      <rect x="156" y="-6" width="6" height="4"/>
      <rect x="178" y="-6" width="6" height="4"/>
      <rect x="200" y="-6" width="6" height="4"/>
      <rect x="222" y="-6" width="6" height="4"/>
      <rect x="244" y="-6" width="6" height="4"/>
      <rect x="266" y="-6" width="6" height="4"/>
      <rect x="288" y="-6" width="6" height="4"/>
    </g>

    <!-- main wings: upper and lower, swept toward tail -->
    <path d="M-40,-10 C-55,-45 -110,-95 -175,-118 C-182,-120 -180,-113 -175,-109 C-130,-82 -80,-45 -55,-12 Z"/>
    <path d="M-40,10 C-55,45 -110,95 -175,118 C-182,120 -180,113 -175,109 C-130,82 -80,45 -55,12 Z"/>

    <!-- winglets -->
    <path d="M-175,-118 L-192,-128 L-182,-110 Z"/>
    <path d="M-175,118 L-192,128 L-182,110 Z"/>

    <!-- wing flap/slat detail lines -->
    <g stroke-width="1">
      <path d="M-70,-20 L-150,-100"/>
      <path d="M-85,-24 L-160,-95"/>
      <path d="M-100,-20 L-168,-80"/>
      <path d="M-70,20 L-150,100"/>
      <path d="M-85,24 L-160,95"/>
      <path d="M-100,20 L-168,80"/>
    </g>

    <!-- engines (rectangles) on each wing -->
    <rect x="-108" y="-72" width="16" height="30" rx="3" transform="rotate(32 -100 -57)"/>
    <rect x="-150" y="-108" width="14" height="26" rx="3" transform="rotate(32 -143 -95)"/>
    <rect x="-108" y="42" width="16" height="30" rx="3" transform="rotate(-32 -100 57)"/>
    <rect x="-150" y="82" width="14" height="26" rx="3" transform="rotate(-32 -143 95)"/>

    <!-- horizontal stabilizers near tail -->
    <path d="M330,-5 C320,-20 290,-35 255,-40 C250,-41 250,-36 254,-34 C285,-24 310,-12 325,0 Z"/>
    <path d="M330,5 C320,20 290,35 255,40 C250,41 250,36 254,34 C285,24 310,12 325,0 Z"/>

    <!-- vertical tail fin -->
    <path d="M360,-8 C372,-30 392,-48 408,-52 C410,-52 410,-48 408,-44 C396,-32 384,-18 372,-6 Z"/>
  </g>

  <rect x="260" y="98" width="680" height="64" rx="10" fill="#001410" opacity="0.55"/>
  <text x="600" y="142" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800"
        fill="#CEDC00" stroke="#001410" stroke-width="2" paint-order="stroke" text-anchor="middle">Shreyans Deshpande</text>
</svg>
