<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100">
  <defs>
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0B0B0B"/>
      <rect width="20" height="20" fill="#F2F2F2"/>
      <rect x="20" y="20" width="20" height="20" fill="#F2F2F2"/>
    </pattern>
  </defs>

  <rect width="1200" height="100" fill="#00352F"/>

  <rect y="0" width="1200" height="30" fill="url(#checker)"/>
  <rect y="70" width="1200" height="30" fill="url(#checker)"/>

  <rect y="0" width="1200" height="6" fill="#CEDC00"/>
  <rect y="94" width="1200" height="6" fill="#CEDC00"/>

  <text x="600" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700"
        letter-spacing="14" fill="#CEDC00" text-anchor="middle">FINISH LINE</text>
</svg>
